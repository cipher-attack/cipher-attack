name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. አዲሱ አጭር Terminal
      - name: Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cipher-attack
          template: terminal
          base: header, metadata
          config_timezone: Africa/Addis_Ababa

      # 2. የ Habits እና ካርታው ፎቶ
      - name: Habits and Map
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cipher-attack
          template: classic
          base: ""
          config_timezone: Africa/Addis_Ababa
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no

      # 3. ה- 3D Isometric Calendar
      - name: 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cipher-attack
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

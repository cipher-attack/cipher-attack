name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. አዲሱ Terminal (ቋንቋዎችንም ያካትታል)
      - name: Terminal with Languages
        uses: lowlighter/metrics@master
        with:
          filename: metrics.terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cipher-attack
          template: terminal
          base: header, metadata
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 6
          config_timezone: Africa/Addis_Ababa

      # 2. 3D Isometric Calendar
      - name: 3D Isometric Calendar
        uses: lowlighter/metrics@master
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cipher-attack
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 3. Lines of Code History
      - name: Lines of Code
        uses: lowlighter/metrics@master
        with:
          filename: metrics.lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cipher-attack
          template: classic
          base: ""
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4

      # 4. Stargazers Worldmap (አዲሱ የካርታ ፕለጊን)
      - name: Hacker Worldmap
        uses: lowlighter/metrics@master
        with:
          filename: metrics.stargazers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cipher-attack
          template: classic
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_sample: 100
          # ማሳሰቢያ፡ ካርታው አድራሻዎችን በደንብ እንዲያነብ የ Google Maps Geocoding API ይፈልግ ይሆናል። 
          # Error ካመጣ ወይም ካርታው ባዶ ከሆነ፣ ከስር ያለውን (#) አጥፍተህ የ Google Map ቶከን ማስገባት ሊኖርብህ ይችላል።
         plugin_stargazers_worldmap_token: ${{ secrets.GOOGLE_MAP_TOKEN }}
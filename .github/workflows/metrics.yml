name: Metrics
on:
  # በየቀኑ ከሌሊቱ 6 ሰዓት ላይ ራሱን Update እንዲያደርግ
  schedule: [{cron: "0 0 * * *"}]
  # አንተ ራስህ በፈለግከው ሰዓት Run ለማድረግ እንዲያስችልህ
  workflow_dispatch:
  # ዋናው ፋይልህ ላይ ለውጥ ስታደርግ Run እንዲያደርግ
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # ያንተን የ GitHub ስም እዚህ አስገባ
          user: cipher-attack
          
          # ለአንተ ፕሮፋይል የሚስማማው የ Terminal ዲዛይን (Hacker Vibe)
          template: terminal
          base: header, metadata, activity, community, repositories
          config_timezone: Africa/Addis_Ababa
          
          # ፕሮግራም የምትጽፍባቸውን ቋንቋዎች (Languages) ለማሳየት
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used
          
          # Wakatime stats (Wakatime token ካስገባህ ይሄን ማብራት ትችላለህ)
          # plugin_wakatime: yes
          # plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          # plugin_wakatime_days: 7
          # plugin_wakatime_sections: time, languages, os
